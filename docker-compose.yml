version: '3.8'

services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: medikiosk-ocr:latest
    container_name: medikiosk-ocr
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Medikiosk OCR
      - APP_ENV=development
      - DEBUG=true
      - API_V1_PREFIX=/api/v1
      - ALLOWED_ORIGINS=http://localhost:5173
    restart: unless-stopped
